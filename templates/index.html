<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radar de Conflitos Aéreos</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <h1>Radar de Conflitos Aéreos</h1>
    <nav class="tabs">
      <button class="tab active" data-tab="radar">Radar</button>
      <button class="tab" data-tab="steps">Passo a passo</button>
      <button class="tab" data-tab="benchmark">Benchmark</button>
    </nav>
  </header>

  <section class="controls">
    <label>Fonte
      <select id="source">
        <option value="sim">Simulação</option>
        <option value="opensky">Snapshot real (OpenSky)</option>
      </select>
    </label>
    <label class="sim-only">Aeronaves <input id="count" type="number" min="2" max="3000" value="400"></label>
    <label class="sim-only">Seed <input id="seed" type="number" value="21"></label>
    <label class="sim-only time">Tempo: <output id="minutes-label">0 min</output>
      <input id="minutes" type="range" min="0" max="120" value="0">
    </label>
    <button id="play" class="sim-only">Reproduzir</button>
  </section>

  <main>
    <section id="tab-radar" class="panel active">
      <div id="map"></div>
      <aside class="side">
        <p id="summary" class="summary"></p>
        <table>
          <thead><tr><th>Nível</th><th>Aeronaves</th><th>Par mais próximo</th><th>Distância</th></tr></thead>
          <tbody id="bands"></tbody>
        </table>
      </aside>
    </section>

    <section id="tab-steps" class="panel">
      <div class="steps-view">
        <svg id="steps-svg" viewBox="0 0 800 520" role="img" aria-label="Pontos da faixa e etapa atual do algoritmo"></svg>
        <aside class="side">
          <h2 id="step-title">Etapa</h2>
          <p id="step-text"></p>
          <div class="step-buttons">
            <button id="step-prev">Anterior</button>
            <button id="step-next">Próxima</button>
            <button id="step-play">Reproduzir</button>
          </div>
          <input id="step-range" type="range" min="0" value="0" aria-label="Etapa">
        </aside>
      </div>
    </section>

    <section id="tab-benchmark" class="panel">
      <div class="benchmark">
        <h2>Tempo por número de pontos</h2>
        <p class="note">Eixos em escala logarítmica. Pontos uniformes, melhor tempo de 3 execuções.</p>
        <button id="run-benchmark">Executar benchmark</button>
        <div id="legend" class="legend" hidden>
          <span><i class="swatch divide"></i>Dividir e conquistar, O(n log n)</span>
          <span><i class="swatch brute"></i>Força bruta, O(n²)</span>
        </div>
        <div id="chart" class="chart"></div>
        <div id="tooltip" class="tooltip" hidden></div>
        <table id="benchmark-table" hidden>
          <thead><tr><th>n</th><th>D&amp;C (ms)</th><th>Bruta (ms)</th><th>Comparações D&amp;C</th><th>Comparações bruta</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="{{ url_for('static', filename='js/tabs.js') }}"></script>
  <script src="{{ url_for('static', filename='js/radar.js') }}"></script>
  <script src="{{ url_for('static', filename='js/steps.js') }}"></script>
  <script src="{{ url_for('static', filename='js/benchmark.js') }}"></script>
</body>
</html>
